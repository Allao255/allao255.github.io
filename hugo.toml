baseURL = "https://allao255.github.io/"
enableRobotsTXT = true

# Inglês na raiz (/), português em /pt/.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  email = "danielpallao@gmail.com"
  github = "https://github.com/allao255"
  linkedin = "https://www.linkedin.com/in/danielpallao"

[languages]
  [languages.en]
    locale = "en"
    label = "English"
    weight = 1
    title = "Daniel Allão"
    [languages.en.params]
      description = "Electrical engineering student working on RF, GNSS security and embedded systems."
    [[languages.en.menus.main]]
      name = "Projects"
      pageRef = "/projects"
      weight = 20
    [[languages.en.menus.main]]
      name = "Notes"
      pageRef = "/notes"
      weight = 30
    [[languages.en.menus.main]]
      name = "CV"
      pageRef = "/cv"
      weight = 40

  [languages.pt]
    locale = "pt-BR"
    label = "Português"
    weight = 2
    title = "Daniel Allão"
    [languages.pt.params]
      description = "Estudante de Engenharia Elétrica trabalhando com RF, segurança de GNSS e sistemas embarcados."
    [[languages.pt.menus.main]]
      name = "Projetos"
      pageRef = "/projects"
      weight = 20
    [[languages.pt.menus.main]]
      name = "Notas"
      pageRef = "/notes"
      weight = 30
    [[languages.pt.menus.main]]
      name = "Currículo"
      pageRef = "/cv"
      weight = 40

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
